plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.3'
}

group = 'dev.geduu'
version = '1.1.0-alpha.2+mc26.1.2'

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        towntrade {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.19.2'
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.4'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.149.0+26.1.2'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    include 'org.xerial:sqlite-jdbc:3.50.3.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand version: version }
}

tasks.register('economyRulesTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.geduu.towntrade.EconomyRulesTest'
}

tasks.named('test') {
    dependsOn economyRulesTest
    exclude '**/EconomyRulesTest.class'
}
